# Display form for a JIS host. Bindings in the keymap are unchanged.
# JP_* in config/keys_ja.h is expanded by the preprocessor, then matched here.
parse_config:
  raw_binding_map:
    "&kp JP_EXCL": "!"
    "&kp JP_DQT": '"'
    "&kp JP_HASH": "#"
    "&kp JP_DLLR": "$"
    "&kp JP_PRCNT": "%"
    "&kp JP_AMPS": "&"
    "&kp JP_SQT": "'"
    "&kp JP_LPAR": "("
    "&kp JP_RPAR": ")"
    "&kp JP_MINUS": "-"
    "&kp JP_EQUAL": "="
    "&kp JP_CARET": "^"
    "&kp JP_TILDE": "~"
    "&kp JP_YEN": "¥"
    "&kp JP_PIPE": "|"
    "&kp JP_AT": "@"
    "&kp JP_GRAVE": "`"
    "&kp JP_LBKT": "["
    "&kp JP_LBRC": "{"
    "&kp JP_SEMI": ";"
    "&kp JP_PLUS": "+"
    "&kp JP_COLON": ":"
    "&kp JP_ASTRK": "*"
    "&kp JP_RBKT": "]"
    "&kp JP_RBRC": "}"
    "&kp JP_COMMA": ","
    "&kp JP_LT": "<"
    "&kp JP_DOT": "."
    "&kp JP_GT": ">"
    "&kp JP_FSLH": "/"
    "&kp JP_QMARK": "?"
    "&kp JP_BSLH": "\\"
    "&kp JP_UNDER": "_"
    "&kp JP_HENK": "変換"
    "&kp JP_MHEN": "無変換"
    "&kp JP_KANA": "かな"
    # Same keys written without the JP_* name.
    "&kp INT_HENKAN": "変換"
    "&kp INT_MUHENKAN": "無変換"
    "&kp INT1": "\\"
    "&kp INT2": "かな"
    "&kp INT3": "¥"
    "&kp INT4": "変換"
    "&kp INT5": "無変換"
    "&kp COMMA": ","
    "&kp PERIOD": "."
    "&kp MINUS": "-"
    "&kp SLASH": "/"
    "&kp SEMICOLON": ";"
    "&kp SEMI": ";"
    "&to_layer_0 MINUS": {t: "-", h: "to 0"}
    "&to_layer_0 SEMICOLON": {t: ";", h: "to 0"}
    "&to_layer_0 SLASH": {t: "/", h: "to 0"}
    "&lt_to_layer_0 5 INT_HENKAN": {t: "変換", h: "6"}
